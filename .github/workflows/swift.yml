name: Swift
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Swift (Linux only)
        if: ${{ runner.os == 'Linux' }}
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
